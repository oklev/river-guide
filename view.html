<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f4c5c" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Trip report · River Guide</title>
    <style>
      :root { --bg: #fff; --fg: #1d2a30; --muted: #61727a; --accent: #0f4c5c; --border: #dbe3e6; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { :root { --bg: #172227; --fg: #e4ecef; --muted: #93a5ad; --accent: #3fa7b8; --border: #2c3b41; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .card { max-width: 440px; margin: 12vh auto 0; padding: 0 16px; text-align: center; }
      h1 { color: var(--accent); font-size: 1.5rem; margin: 0 0 8px; }
      p { margin: 8px 0; }
      .muted { color: var(--muted); font-size: 14px; }
      button { font: inherit; font-weight: 600; padding: 10px 20px; border-radius: 8px; border: 0; background: var(--accent); color: var(--bg); cursor: pointer; margin-top: 12px; }
      button[hidden] { display: none; }
      #report { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
      #report[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <h1>Trip report</h1>
      <p id="message">Someone shared a River Guide trip report with you through Google Drive.</p>
      <button id="open">Sign in with Google to open it</button>
      <p class="muted" id="status" role="status"></p>
      <p class="muted">River Guide only gets access to the report you open, not the rest of your Drive.
        <a href="../privacy.html">Privacy policy</a></p>
    </div>
    <!-- The report runs isolated: it can't reach this site's storage or your Google sign-in. -->
    <iframe id="report" title="Trip report" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" hidden></iframe>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
